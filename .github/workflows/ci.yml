name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: python deps
        run: python -m pip install --upgrade pip && python -m pip install "numpy<2" h5py pandas pyarrow requests tqdm zstandard ruff mypy
      - name: ruff
        run: ruff check npc_labeler tests
      - name: mypy
        run: mypy
      - name: python compile
        run: python -m compileall npc_labeler tests
      - name: python tests
        run: python -m unittest discover -s tests
      - name: docker build
        run: docker build -t npc-labeler .
